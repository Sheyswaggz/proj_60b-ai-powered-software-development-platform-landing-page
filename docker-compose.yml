services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landing-page-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      com.example.description: "AI-Powered Software Development Platform Landing Page"
      com.example.version: "1.0.0"